# tUPDATE - Konfiguration

# === Download ===
download.url = https://example.org/releases/app-latest.zip
download.timeout.seconds = 300

# Parallele Download-Verbindungen (HTTP-Range). Default 4, Maximum 16, 1 = aus.
# Wirkt nur, wenn der Server Range-Requests beantwortet UND die Datei gross
# genug ist (mind. 8 MiB je Verbindung) - sonst faellt tUPDATE automatisch auf
# einen einzelnen Stream zurueck. Ueberschreibbar per --download-parts.
# Bringt vor allem etwas, wenn der Server pro Verbindung drosselt oder die
# Leitung hohe Latenz hat; limitiert der Server-Uplink, hilft es nicht.
#download.parallel.parts = 4

# === Proxy (leer = direkt) ===
proxy.url =
proxy.user =
proxy.password =
proxy.no_proxy = localhost,127.0.0.1

# === Sync-Verzeichnisse (komma-getrennt, relativ zu App-Root, rekursiv) ===
# Fehlende Verzeichnisse (weder im ZIP noch live vorhanden) werden ohne Fehler übersprungen.
sync.directories = bin, www, etc, lib, libs

# Wie viele Dateien beim Diff parallel verglichen werden.
# Default: min(CPU-Kerne, 8). Ueberschreibbar per --diff-workers.
# Hoehere Werte helfen auf SSD/NVMe, koennen auf Netzlaufwerken oder
# klassischen Festplatten aber bremsen -> dort ggf. 1 oder 2 setzen.
#diff.workers = 8

# === Service-Kommandos (per Betriebssystem) ===
service.stop.windows  = net stop MyService
service.stop.darwin   = launchctl stop org.example.myapp
service.stop.linux    = systemctl stop myservice
service.start.windows = net start MyService
service.start.darwin  = launchctl start org.example.myapp
service.start.linux   = systemctl start myservice
service.stop.timeout.seconds  = 60
service.start.timeout.seconds = 60

# === Backup ===
backup.directory = backup

# === DB-Dump via pg_dump ===
# Der DB-Backup-Prompt wird IMMER gestellt (unabhaengig vom ZIP-Backup).
# Bei "Ja" wird pg_dump aufgerufen.
# Binary-Lookup-Reihenfolge:
#   1. pgdump.path.<aktuelles-OS> aus dieser Datei
#   2. Fallback: exec.LookPath("pg_dump") = PATH-Suche
#   3. Wenn nichts gefunden -> Info-Zeile + weitermachen, kein Fehler
# Ausgabe: <backup.directory>/<yyyy-MM-dd-HH-mm-ss>-db.backup (Format -Fc).
# Schlaegt pg_dump fehl -> Info-Zeile + weitermachen, kein Fehler.
#pgdump.path.windows = C:\\Program Files\\PostgreSQL\\16\\bin\\pg_dump.exe
#pgdump.path.darwin  = /opt/homebrew/opt/postgresql@16/bin/pg_dump
#pgdump.path.linux   = /usr/bin/pg_dump

# Connection-Parameter werden als PG*-Env-Variablen an pg_dump uebergeben.
# Conf-Werte gewinnen gegenueber bestehenden PG*-Variablen im Parent-Process.
# Alternativ: nichts hier setzen und ~/.pgpass oder Shell-Env nutzen.
# Wenn pgdump.password gesetzt ist, wird automatisch -w (never prompt)
# vorne in die pg_dump-Argv eingefuegt, damit der Prozess nicht haengt.
# WARNUNG: pgdump.password steht hier IM KLARTEXT -> Datei mit chmod 600
# absichern.
#pgdump.host     = localhost
#pgdump.port     = 5432
#pgdump.user     = postgres
#pgdump.password = geheim
#pgdump.db       = mydb

# Optionale zusaetzliche pg_dump-Argv (space-split, kein Quoting).
# Wird hinter -Fc -f <out> [-w] gehangen. Hier KEIN Passwort uebergeben
# (pg_dump kennt kein --password=<wert>).
#pgdump.args = --schema=public --exclude-table=audit_log
